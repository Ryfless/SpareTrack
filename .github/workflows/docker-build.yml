name: Docker Build

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  docker:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Check changed paths
        id: changed
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
          else
            echo "build_backend=true" >> $GITHUB_OUTPUT
            echo "build_ml=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if echo "$CHANGED" | grep -q '^backend/'; then
            echo "build_backend=true" >> $GITHUB_OUTPUT
          fi
          if echo "$CHANGED" | grep -q '^inventory_ml/'; then
            echo "build_ml=true" >> $GITHUB_OUTPUT
          fi
          {
            echo "### Changes detected"
            echo "\`\`\`"
            echo "$CHANGED" | grep -E '^(backend/|inventory_ml/)' || echo "(none)"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        if: steps.changed.outputs.build_backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/ryfless/sparetrack-backend:latest
            ghcr.io/ryfless/sparetrack-backend:${{ github.event.workflow_run.head_sha }}

      - name: Build & push inventory_ml
        if: steps.changed.outputs.build_ml == 'true'
        uses: docker/build-push-action@v5
        with:
          context: inventory_ml
          push: true
          tags: |
            ghcr.io/ryfless/sparetrack-inventory-ml:latest
            ghcr.io/ryfless/sparetrack-inventory-ml:${{ github.event.workflow_run.head_sha }}

      - name: Trigger Render Deploy — Backend
        if: steps.changed.outputs.build_backend == 'true'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: curl -f -X POST "$RENDER_DEPLOY_HOOK"

      - name: Trigger Render Deploy — Inventory ML
        if: steps.changed.outputs.build_ml == 'true'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_INVENTORY_ML }}
        run: curl -f -X POST "$RENDER_DEPLOY_HOOK"
