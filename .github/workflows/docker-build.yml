name: Docker Build

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'inventory_ml/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed paths
        id: changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build_backend=true" >> "$GITHUB_OUTPUT"
            echo "build_ml=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE=$(git merge-base HEAD~1 HEAD 2>/dev/null || echo HEAD~1)
          CHANGED=$(git diff --name-only "$BASE" HEAD)

          if echo "$CHANGED" | grep -q '^backend/'; then
            echo "build_backend=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -q '^inventory_ml/'; then
            echo "build_ml=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### Changes detected"
            echo "\`\`\`"
            echo "$CHANGED" | grep -E '^(backend/|inventory_ml/)' || echo "(none)"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        if: steps.changed.outputs.build_backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/ryfless/sparetrack-backend:latest
            ghcr.io/ryfless/sparetrack-backend:${{ github.sha }}

      - name: Build & push inventory_ml
        if: steps.changed.outputs.build_ml == 'true'
        uses: docker/build-push-action@v5
        with:
          context: inventory_ml
          push: true
          tags: |
            ghcr.io/ryfless/sparetrack-inventory-ml:latest
            ghcr.io/ryfless/sparetrack-inventory-ml:${{ github.sha }}

      - name: Trigger Render Deploy — Backend
        if: steps.changed.outputs.build_backend == 'true'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: curl -f -X POST "$RENDER_DEPLOY_HOOK"

      - name: Trigger Render Deploy — Inventory ML
        if: steps.changed.outputs.build_ml == 'true'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_INVENTORY_ML }}
        run: curl -f -X POST "$RENDER_DEPLOY_HOOK"
